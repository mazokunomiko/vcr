<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCR Workspace Dashboard</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #141419; 
            color: #ffffff; 
            text-align: center; 
            padding: 50px 20px; 
            margin: 0;
        }
        h1 { font-size: 26px; color: #00fa9a; margin-bottom: 5px; }
        p { color: #a0a0b0; margin-bottom: 40px; font-size: 15px; }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .btn { 
            display: block; 
            width: 85%; 
            max-width: 320px; 
            padding: 18px; 
            font-size: 18px; 
            font-weight: bold; 
            color: #ffffff; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-decoration: none;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-sender { background: #007bff; }
        .btn-viewer { background: #28a745; }
    </style>
</head>
<body>

    <h1>📺 VCR System Controller</h1>
    <p>Plug in your capture card and tap each step:</p>

    <div class="button-container">
        <!-- Step 1: Opens the hardware stream in a new tab -->
        <a class="btn btn-sender" id="senderLink" href="#" target="_blank">
            1. Start Hardware Feed
        </a>
        
        <!-- Step 2: Opens the clean viewing screen in a standalone video window -->
        <button class="btn btn-viewer" onclick="launchPlayer()">
            2. Open Player Window
        </button>
    </div>

    <script>
        var domainName = "vdo.ninja";
        var roomName = "MyVCRPlayer";
        
        // Assemble Full Link 1 (Sender) using the &vdo=2 hardcoded bypass
        var senderUrl = "https://" + domainName + "/?addcamera&push=" + roomName + "&proaudio=1&autostart&vdo=2";
        document.getElementById("senderLink").href = senderUrl;

        // Assemble Full Link 2 (Viewer)
        function launchPlayer() {
            var viewerUrl = "https://" + domainName + "/?view=" + roomName + "&nocontrols";
            window.open(
                viewerUrl, 
                "VCRPlayerWindow", 
                "width=1280,height=720,menubar=no,status=no,toolbar=no"
            );
        }
    </script>

</body>
</html>
