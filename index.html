<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCR Player Link</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #141419; 
            color: #ffffff; 
            text-align: center; 
            padding: 80px 20px; 
            margin: 0;
        }
        h1 { font-size: 28px; color: #00fa9a; margin-bottom: 30px; }

            border-radius: 12px;

        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>📺 VCR System Link Launcher</h1>
    
    <!-- This single link acts as both sender and listener automatically -->

    </a>

</body>
</html>
